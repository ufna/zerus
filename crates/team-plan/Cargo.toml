[package]
name = "zerus-team-plan"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Agent team types and the pure rules that decide what may run"
publish = false

# Shared by hgs and its clients. Keep it pure: serde only, no I/O, no clock,
# no Loro, no async runtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared character rule for names and titles (zerus-63rru.74).
zerus-replica = { path = "../replica" }
