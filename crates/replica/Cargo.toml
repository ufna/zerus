[package]
name = "zerus-replica"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Replicated Zerus documents on Loro: the task schema, its rules and storage"
publish = false

[features]
# Helpers that other crates' tests use to build documents only an older
# replica writes (never enabled outside tests).
test-support = []
# Compatibility control: compile the current-schema reader without the
# optional team field. Never enabled by production consumers.
test-without-team = []

[dependencies]
base64 = "0.22"
# The only crate in Zerus that imports Loro. Raise this pin deliberately: the
# golden vectors in tests/vectors must still decode (see tests/vectors.rs).
loro = { version = "=1.16.2", default-features = false }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW and O_NONBLOCK for reading the change journal.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Unoptimized Loro makes the larger exchange tests slow: this crate's own test
# builds optimize their dependencies.
[profile.dev.package."*"]
opt-level = 2
