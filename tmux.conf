# hgs — tmux as an invisible session daemon (github.com/ufna/zerus). Shared configuration for Linux and macOS.
# No windows/panes workflow here: one session = one command; tabs/splits belong to the terminal app.
set -g  mouse on                      # wheel scrolls, mouse selects
set -g  history-limit 50000
set -s  escape-time 0
set -g  focus-events on
set -g  window-size latest            # size follows the last active client, not the smallest
set -s  set-clipboard on              # OSC52: copies land in the client's clipboard
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -s  extended-keys always          # Shift+Enter etc. where the client speaks CSI-u
set -s  extended-keys-format csi-u
set -g  status-left  "#S "
set -g  status-left-length 50
set -g  status-right "#h"
bind C-d detach-client                # prefix then Ctrl-still-held d also detaches (common muscle memory)
# Ctrl+V in a session attached from the other box: pull that box's clipboard image into this
# one first (hgs paste -> ssh peer hgs clip), then pass C-v on. Local attach: C-v passes as is.
bind -n C-v run-shell -b "~/.local/bin/hgs paste '#{session_name}' '#{pane_id}' '#{client_name}'"
