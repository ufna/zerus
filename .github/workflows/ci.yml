# PRIVATE DIAGNOSTIC BRANCH ONLY. Never merge this workflow into main.
name: Windows module cache diagnostic
run-name: Windows module cache diagnostic ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder:
    name: Private Windows module cache probes
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Verify original source and tools
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python --version
      # Intentionally no cache restore/save, secrets, publication or install step.
      - name: Measure the six authorized first calls once
        timeout-minutes: 8
        run: |
          cd tests
          python -m unittest -v test_windows_module_cache.ModuleCache </dev/null
