name: Accounting compiler evidence only
run-name: Accounting no-run ${{ inputs.ref }} attempt ${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed diagnostic commit (must equal the selected workflow commit)
        required: true
        type: string

permissions:
  contents: read
cache-mode: none

jobs:
  compiler-evidence:
    name: One diagnostic no-run compiler artifact
    if: >-
      github.repository == 'ufna/zerus' && github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/accounting-no-run-cf3'
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    cache-mode: none
    env:
      INPUT_REF: ${{ inputs.ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Bind the one selected workflow attempt
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$INPUT_REF" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$RUNNER_ENVIRONMENT" = github-hosted

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact CF3 derivation and allocate disposable paths
        id: paths
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = cf3dc42d4cc6f47d51b2faaea6620463844ad288
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/ci.yml\nscripts/ci/accounting-no-run-evidence.py\nsrc/state/creation_launch_status.rs'
          test "$actual" = "$expected"
          root="$RUNNER_TEMP/accounting-no-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$root"
          mkdir "$root"/{home,cargo,rustup,target,tmp,config,data,state,cache,evidence}
          git ls-files -z > "$root/evidence/tracked-paths.z"
          toolchain="$root/rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu/bin"
          {
            echo "EVIDENCE_DIR=$root/evidence"
            echo "BUILD_HOME=$root/home"
            echo "BUILD_TMP=$root/tmp"
            echo "BUILD_CONFIG=$root/config"
            echo "BUILD_DATA=$root/data"
            echo "BUILD_STATE=$root/state"
            echo "BUILD_CACHE=$root/cache"
            echo "CARGO_HOME=$root/cargo"
            echo "RUSTUP_HOME=$root/rustup"
            echo "CARGO_TARGET_DIR=$root/target"
            echo "BUILD_CARGO=$toolchain/cargo"
            echo "BUILD_RUSTC=$toolchain/rustc"
            echo "BUILD_RUSTDOC=$toolchain/rustdoc"
            echo "BUILD_PATH=$toolchain:/usr/bin:/bin"
            echo "RUSTUP_BIN=$(command -v rustup)"
          } >> "$GITHUB_ENV"

      - name: Install only the selected public toolchain and record identities
        timeout-minutes: 4
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" LANG=C.UTF-8 \
            "$RUSTUP_BIN" toolchain install 1.99.1-x86_64-unknown-linux-gnu --profile minimal
          "$BUILD_RUSTC" --version --verbose > "$EVIDENCE_DIR/rustc-version.txt"
          "$BUILD_CARGO" --version --verbose > "$EVIDENCE_DIR/cargo-version.txt"
          "$BUILD_RUSTC" --test --print cfg --target x86_64-unknown-linux-gnu > "$EVIDENCE_DIR/compiler-cfg.txt"
          cc --version > "$EVIDENCE_DIR/cc-version.txt"
          ar --version > "$EVIDENCE_DIR/ar-version.txt"
          python3 -I -S -B scripts/ci/accounting-no-run-evidence.py before

      - name: ONE root Cargo test-artifact build; never run its output
        id: compile
        timeout-minutes: 24
        run: |
          set -uo pipefail
          set +e
          env -i PATH="$BUILD_PATH" HOME="$BUILD_HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR" RUSTC="$BUILD_RUSTC" RUSTDOC="$BUILD_RUSTDOC" \
            CARGO_BUILD_JOBS=4 CARGO_INCREMENTAL=0 CARGO_TERM_COLOR=never \
            CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
            HGS_CONFIG_DIR="$BUILD_CONFIG" HGS_DATA_DIR="$BUILD_DATA" HGS_STATE_DIR="$BUILD_STATE" \
            XDG_CONFIG_HOME="$BUILD_CONFIG" XDG_DATA_HOME="$BUILD_DATA" \
            XDG_STATE_HOME="$BUILD_STATE" XDG_CACHE_HOME="$BUILD_CACHE" \
            TMPDIR="$BUILD_TMP" TMP="$BUILD_TMP" TEMP="$BUILD_TMP" TMUX_TMPDIR="$BUILD_TMP" \
            "$BUILD_CARGO" test --locked --bin hgs --no-run --message-format=json-render-diagnostics --verbose \
            2>&1 | python3 -I -S -B scripts/ci/accounting-no-run-evidence.py capture
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\t%s\n' "${codes[0]}" "${codes[1]}" > "$EVIDENCE_DIR/pipeline-status.txt"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0

      - name: Passive source-final, Cargo-record and emitted-ELF evidence
        if: always() && steps.paths.outcome == 'success'
        timeout-minutes: 2
        run: python3 -I -S -B scripts/ci/accounting-no-run-evidence.py collect

      - name: Retain only named bounded diagnostic evidence
        if: always() && steps.paths.outcome == 'success'
        id: retention
        timeout-minutes: 2
        run: python3 -I -S -B scripts/ci/accounting-no-run-evidence.py retention

      - name: Upload the bounded named diagnostic evidence
        id: upload
        if: always() && steps.retention.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accounting-compiler-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.EVIDENCE_DIR }}/cargo-combined.raw
            ${{ env.EVIDENCE_DIR }}/capture.json
            ${{ env.EVIDENCE_DIR }}/pipeline-status.txt
            ${{ env.EVIDENCE_DIR }}/context.json
            ${{ env.EVIDENCE_DIR }}/toolchain.json
            ${{ env.EVIDENCE_DIR }}/source-before.json
            ${{ env.EVIDENCE_DIR }}/source-after.json
            ${{ env.EVIDENCE_DIR }}/compiler-evidence.json
            ${{ env.EVIDENCE_DIR }}/hgs-test.elf
            ${{ env.EVIDENCE_DIR }}/hgs-test.elf.partial
            ${{ env.EVIDENCE_DIR }}/retention.json

      - name: Bind the immutable diagnostic artifact receipt
        if: always() && steps.upload.outcome == 'success'
        timeout-minutes: 1
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'Diagnostic artifact %s SHA256 %s; source %s; run %s attempt %s job %s.\n' \
            "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
