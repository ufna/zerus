name: CI
run-name: Windows search index diagnostic ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: read
jobs:
  search-index-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - name: Preserve fixture bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Search unit contracts on native Windows
        run: |
          mkdir -p artifacts/test-results
          cargo test --locked --bin hgs state::search -- --nocapture --test-threads=2 </dev/null 2>&1 | tee artifacts/test-results/search-rust.log
          cargo test --locked --manifest-path crates/content-search/Cargo.toml --lib </dev/null 2>&1 | tee artifacts/test-results/index-core.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee artifacts/test-results/clippy.log
      - name: CLI contracts on native Windows
        run: |
          cargo build --locked --bin hgs
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/debug/hgs.exe")
          export HGS_TEST_BIN
          python -m unittest -v tests.test_search tests.test_search_index </dev/null 2>&1 | tee artifacts/test-results/search-cli.log
      - name: Retain raw diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-search-index-${{ github.sha }}
          path: artifacts/test-results
          retention-days: 3
