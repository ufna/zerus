name: Nightly
run-name: Nightly main

on:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'ufna/zerus' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      run_linux: true
      run_arch: true
      run_macos: true
