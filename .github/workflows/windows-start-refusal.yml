name: Windows Start-refusal qualification

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to qualify (not a moving branch)
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      QUALIFICATION_SOURCE: ${{ inputs.ref }}
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock', 'client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Standard-user NTFS controls, runtime mutants and restored controls
        run: python scripts/ci/windows-start-refusal.py
      - name: Native Windows all-target clippy
        run: cargo +1.99.1 clippy --locked --all-targets -j 4 -- -D warnings
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-start-refusal-${{ inputs.ref }}
          path: artifacts/test-results/start-refusal
          if-no-files-found: warn
          retention-days: 7
