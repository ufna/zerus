name: Latest Kimi native contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-native.yml'
      - 'scripts/ci/kimi-native*'
      - 'scripts/ci/native_discovery.py'
      - 'tests/test_native_discovery.py'
      - 'scripts/ci/native-effort-seed.py'
      - 'scripts/ci/kimi-native-manifests/**'
      - 'scripts/ci/install-tmux.sh'
      - 'tests/kimi_release.py'
      - 'tests/test_kimi*.py'
      - 'tests/native_effort_id.py'
      - 'tests/test_questions.py'
      - 'tests/test_input.py'
      - 'tests/test_pause.py'
      - 'tests/fixtures/kimi*'
      - 'src/state/**'
      - 'src/host/**'
      - 'src/platform/**'
      - 'src/cli.rs'
      - 'src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
  workflow_dispatch:

permissions:
  contents: read
cache-mode: none

# Pull requests: one run per PR, and a new head cancels the older run;
# closing the PR cancels the rest (pr-closed.yml, zerus-b8zze).
# Manual runs keep their per-ref group without cancellation.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('kimi-native-pr-{0}', github.event.pull_request.number) || format('kimi-native-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Kimi latest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-15"]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_JOBS: 2
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Bounded discovery controls without native execution
        run: python -B -m unittest discover -s tests -p test_native_discovery.py -v
      - name: Keep Cargo and Rustup in this ephemeral runner's private temporary directory
        shell: bash
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/kimi-target"
            echo "CARGO_HOME=$RUNNER_TEMP/kimi-cargo"
            echo "RUSTUP_HOME=$RUNNER_TEMP/kimi-rustup"
          } >> "$GITHUB_ENV"
      - name: Refuse an unreviewed runner architecture before building
        run: python -c "import runpy; runpy.run_path('scripts/ci/kimi-native.py')['target']()"
      - name: Linux tmux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - name: macOS tmux build dependencies
        if: runner.os == 'macOS'
        run: brew install coreutils libevent ncurses utf8proc jemalloc bison pkg-config
      - name: Build the existing pinned tmux release privately
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
            PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig:$(brew --prefix jemalloc)/lib/pkgconfig"
            export PATH PKG_CONFIG_PATH
          fi
          bash scripts/ci/install-tmux.sh "$RUNNER_TEMP/kimi-tmux"
      - name: Build the exact CLI and private test seed with pinned Rust and at most two jobs
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.99.1 python -s -B scripts/ci/native-effort-seed.py build --source-sha "$SOURCE_SHA" \
            --hgs "$CARGO_TARGET_DIR/debug/hgs" --image "$RUNNER_TEMP/kimi-seed/hgs-effort-seed" \
            --receipt "$RUNNER_TEMP/kimi-seed/hgs-effort-seed.json"
      - name: One official latest release, original fourteen plus one ID Effort native case
        shell: bash
        run: |
          python -s -B scripts/ci/kimi-native.py --source-sha "$SOURCE_SHA" \
            --hgs "$CARGO_TARGET_DIR/debug/hgs" --tmux "$RUNNER_TEMP/kimi-tmux/bin/tmux" \
            --effort-seed-receipt "$RUNNER_TEMP/kimi-seed/hgs-effort-seed.json" \
            --output "$GITHUB_WORKSPACE/artifacts/test-results/kimi-native" </dev/null
      - name: Retain exact native results and raw logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimi-native-results-${{ matrix.os }}-${{ env.SOURCE_SHA }}
          path: artifacts/test-results/kimi-native/evidence
          retention-days: 7
      - name: Retain images and diagnostic runtime when qualification is unknown or failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimi-native-retained-${{ matrix.os }}-${{ env.SOURCE_SHA }}
          path: |
            artifacts/test-results/kimi-native/images
            artifacts/test-results/kimi-native/unknown-runtime.tar.gz
          retention-days: 3
