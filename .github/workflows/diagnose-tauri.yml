name: Disposable hosted Tauri diagnosis (never merge)

on:
  workflow_call:

permissions:
  contents: read
cache-mode: read

jobs:
  build:
    name: macos-15 build only (no test executable starts)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/diagnose-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record build boundary before compiling
        run: |
          mkdir -p artifacts/tauri-diagnostic
          git rev-parse HEAD > artifacts/tauri-diagnostic/source.txt
          rustc +1.99.1 -Vv > artifacts/tauri-diagnostic/rustc.txt
          df -h > artifacts/tauri-diagnostic/disk-before.txt
          sysctl hw.memsize > artifacts/tauri-diagnostic/memory-before.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-build-boundary
          path: artifacts/tauri-diagnostic/
          retention-days: 7

      - name: Build without running or listing tests
        run: |
          set -o pipefail
          cargo +1.99.1 test --locked --manifest-path client/src-tauri/Cargo.toml --no-run --message-format=json > artifacts/tauri-diagnostic/build.jsonl
          python3 scripts/ci/diagnose-tauri.py bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-test-bundle
          path: artifacts/tauri-diagnostic/
          retention-days: 7

  list:
    name: macos-15 executable startup and listing only
    needs: build
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauri-test-bundle
          path: artifacts/tauri-diagnostic/
      - name: Verify source and executable, list without running tests
        run: python3 scripts/ci/diagnose-tauri.py list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-test-inventory
          path: artifacts/tauri-diagnostic/
          retention-days: 7

  tests:
    name: macos-15 serial test batch ${{ matrix.batch }}
    needs: list
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauri-test-inventory
          path: artifacts/tauri-diagnostic/
      - name: Persist exact batch before suspect execution
        run: python3 scripts/ci/diagnose-tauri.py prepare ${{ matrix.batch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-batch-${{ matrix.batch }}-boundary
          path: artifacts/tauri-diagnostic/batch-*.json
          retention-days: 7
      - name: Each exact test has a private environment and 45 second deadline
        run: python3 scripts/ci/diagnose-tauri.py run ${{ matrix.batch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-batch-${{ matrix.batch }}-results
          path: |
            artifacts/tauri-diagnostic/*.json
            artifacts/tauri-diagnostic/*.log
          retention-days: 7


  repeat:
    name: macos-15 twenty exact real PTY flood repetitions
    needs: tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauri-test-inventory
          path: artifacts/tauri-diagnostic/
      - name: Twenty fresh private exact flood invocations with original deadlines
        run: python3 scripts/ci/diagnose-tauri.py repeat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-flood-repeat-results
          path: |
            artifacts/tauri-diagnostic/*.json
            artifacts/tauri-diagnostic/*.log
          retention-days: 7

  parallel:
    name: macos-15 ordinary parallel harness after serial batches and flood repetitions
    needs: repeat
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauri-test-inventory
          path: artifacts/tauri-diagnostic/
      - name: Three minute owned-process deadline, private environment
        run: python3 scripts/ci/diagnose-tauri.py parallel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-default-parallel-results
          path: |
            artifacts/tauri-diagnostic/*.json
            artifacts/tauri-diagnostic/*.log
          retention-days: 7
