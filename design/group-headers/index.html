<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hgs zerus · Варианты групп</title>
<style>
:root{color-scheme:dark;--bg:#12181d;--surface:#1c242b;--line:#35414b;--text:#e8edf4;--muted:#a1adbb;--mint:#8bdfc0;--blue:#84b9ff;--amber:#f0c77b}*{box-sizing:border-box}body{margin:0;padding:42px;font:14px system-ui;background:var(--bg);color:var(--text)}h1{font-size:25px;margin:0 0 10px}p{color:var(--muted);line-height:1.6;max-width:850px}.variants{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:24px;margin-top:30px;max-width:1260px}.variant{border:1px solid var(--line);border-radius:14px;overflow:hidden}.caption{padding:20px;border-bottom:1px solid var(--line);min-height:120px}.caption h2{font-size:17px;margin:0}.caption p{font-size:12px;margin:8px 0 0}.sidebar{padding:14px;background:#161b21;min-height:540px}.toolbar{display:flex;justify-content:space-between;font-weight:600;margin:4px 6px 18px}.toolbar span{color:var(--mint)}.group{margin:12px 0 6px}.group button{border:0;background:transparent;color:var(--text);font:600 13px system-ui;display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;text-align:left;cursor:pointer;border-radius:6px}.group button:hover{filter:brightness(1.25)}.arrow{font-size:16px;color:var(--muted);width:10px}.group svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}.group.pinned svg{color:var(--mint)}.group .name{flex:1}.count{font-size:11px;color:var(--muted);font-weight:500}.attention{font-size:11px;color:var(--amber);background:#4b3c24;border-radius:5px;padding:2px 5px}.working{color:var(--blue);font-size:11px}.band .group button{background:#252f38}.band .pinned button{background:#233a35}.stripe .group button{border-left:3px solid var(--mint);border-radius:0 5px 5px 0}.stripe .group.docs button{border-left-color:var(--blue)}.line .group button{border-radius:0;font-size:14px;border-bottom:1px solid var(--line);height:38px}.session{padding:9px 11px;margin:4px 2px;border:1px solid transparent;border-radius:8px;font-size:13px}.session.selected{background:#233a35;border-color:#456e61}.session .row{display:flex;align-items:center;gap:6px;min-height:20px}.session .title{flex:1}.dot{color:var(--blue)}.provider{font-size:11px;border-radius:4px;background:#303942;color:#a6d8c5;padding:1px 6px}.provider.kimi{color:#bac1ff}.provider.claude{color:#e8b29b}.meta{color:var(--muted);font-size:11px;flex:1}.machine{font-size:11px;background:#203e3c;color:#9bcdca;border-radius:4px;padding:1px 6px}.machine.mac{background:#203b48;color:#8dccdf}.status{font-size:12px;margin-top:3px}.group.collapsed+.members{display:none}.note{font-size:12px;margin-top:25px}button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}@media(max-width:1000px){.variants{grid-template-columns:1fr;max-width:450px}body{padding:22px}}
</style>
<h1>Как сделать группы заметнее</h1><p>Одинаковая плотность и информация, три способа отделить группы. Нажмите на заголовок: группа свернётся, а счётчики останутся. Pinned закреплена сверху.</p><div class="variants" id="variants"></div><p class="note">Это интерактивное сравнение оформления. Реальные сессии и их порядок здесь не изменяются.</p>
<script>
const folder='<svg viewBox="0 0 24 24"><path d="M3 8V5h7l2 3h9v11H3Z"/></svg>';
const pin='<svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 4 4H5l4-4-1-6ZM12 13v8"/></svg>';
const session=(title,project,agent,host,status,selected=false)=>`<div class="session ${selected?'selected':''}"><div class="row"><span class="dot">•</span><span class="title">${title}</span><span class="provider ${agent.toLowerCase()}">${agent==='Kimi'?'K':agent==='Claude'?'✳':'›_'} ${agent}</span></div><div class="row"><span class="meta">${project} · main</span><span class="machine ${host}">${host}</span></div><div class="status">${status}</div></div>`;
const group=(name,count,extra='',kind='',collapsed=false)=>`<div class="group ${kind} ${collapsed?'collapsed':''}"><button aria-expanded="${!collapsed}"><span class="arrow">${collapsed?'›':'⌄'}</span>${kind==='pinned'?pin:folder}<span class="name">${name}</span>${extra}<span class="count">${count}</span></button></div>`;
const styles=[['band','01 · Строка с фоном','Рекомендую: чётко отделяет группы, не увеличивая их высоту.'],['stripe','02 · Полоса слева','Цвет помогает узнавать группу при быстром просмотре.'],['line','03 · Заголовок и линия','Более спокойный вариант: сильнее типографика, меньше заливок.']];
document.getElementById('variants').innerHTML=styles.map(([style,name,desc])=>`<section class="variant ${style}"><div class="caption"><h2>${name}</h2><p>${desc}</p></div><div class="sidebar"><div class="toolbar">Sessions <span>＋　⋯</span></div>${group('Pinned',2,'<span class="working">● 1</span>','pinned')}<div class="members">${session('hgs','hgs','Codex','arch','Working · Обновление интерфейса',true)}${session('dashboard','sample-project','Kimi','arch','Ready')}</div>${group('infra',4,'<span class="attention">! 1</span>','',true)}<div class="members">${session('sample-project','sample-project','Claude','mac','Needs input')}</div>${group('sample-app',4,'<span class="working">● 2</span>','docs')}<div class="members">${session('tooling','project-docs','Codex','arch','Status unavailable')}${session('backup','project-docs','Codex','arch','Working · Проверка бэкапов')}</div></div></section>`).join('');
document.querySelectorAll('.group button').forEach(b=>b.addEventListener('click',()=>{const collapsed=b.parentElement.classList.toggle('collapsed');b.setAttribute('aria-expanded',!collapsed);b.querySelector('.arrow').textContent=collapsed?'›':'⌄'}));
</script></html>
